# Link-preview crawlers (LinkedIn, Slack, WhatsApp, X, Facebook, Google...) cannot run the React app,
# so profile URLs requested by them are answered by the API's /og endpoint, which returns the right
# title/description/image tags. Everyone else gets the single-page app.
map $http_user_agent $preview_bot {
    default 0;
    ~*(facebookexternalhit|facebot|linkedinbot|twitterbot|slackbot|slack-imgproxy|whatsapp|telegrambot|discordbot|pinterest|redditbot|skypeuripreview|applebot|googlebot|bingbot|embedly|vkshare|tumblr|bitlybot|mastodon) 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build files never change, so browsers may keep them for a year.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Public profile links: /u/<slug> and /user/<uuid>
    location ~ "^/u/(?<og_ref>[a-z0-9-]+)/?$" {
        if ($preview_bot) { rewrite ^ /__og/$og_ref last; }
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location ~ "^/user/(?<og_ref>[0-9a-fA-F-]{36})/?$" {
        if ($preview_bot) { rewrite ^ /__og/$og_ref last; }
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location ~ "^/__og/(?<og_target>[A-Za-z0-9-]+)$" {
        internal;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $api_origin "__API_ORIGIN__";
        proxy_pass $api_origin/og/$og_target;
        proxy_ssl_server_name on;
        proxy_set_header Host __API_HOST__;
        proxy_set_header User-Agent $http_user_agent;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Single-page app: every other path serves index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
